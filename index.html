<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0e1a2b">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>食材流体云</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<style>
:root{
  --bg:#0e1a2b; --panel:rgba(255,255,255,.06); --line:rgba(255,255,255,.14);
  --txt:#eaf2ff; --sub:#9fb3d1; --accent:#5ec8ff; --accent2:#7dffd4;
  --danger:#ff7a7a; --radius:18px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:
    radial-gradient(1200px 600px at 85% -10%, rgba(94,200,255,.16), transparent 60%),
    radial-gradient(900px 500px at 0% 110%, rgba(125,255,212,.10), transparent 55%),
    var(--bg);
  color:var(--txt); min-height:100vh;
}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 40px;}
header{display:flex;align-items:center;justify-content:space-between;padding:8px 2px 14px;}
header h1{margin:0;font-size:22px;font-weight:700;letter-spacing:1px;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;background-clip:text;color:transparent;}
header .pwa{margin:0;font-size:11px;color:var(--sub);}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;margin-bottom:14px;backdrop-filter:blur(8px);}
.card h2{margin:0 0 12px;font-size:15px;color:var(--sub);font-weight:600;letter-spacing:.5px;}
.row{display:flex;gap:10px;flex-wrap:wrap;}
.btn{flex:1;min-width:110px;border:1px solid var(--line);background:rgba(255,255,255,.04);
  color:var(--txt);border-radius:12px;padding:13px 10px;font-size:14px;text-align:center;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:4px;transition:.2s;}
.btn .ico{font-size:20px;}
.btn:hover,.btn:active{background:rgba(255,255,255,.1);}
.btn.primary{background:linear-gradient(135deg,var(--accent),#3ea6ff);border:none;color:#052033;font-weight:700;}
.btn.primary:disabled{opacity:.5;}
textarea{width:100%;min-height:96px;background:rgba(0,0,0,.25);color:var(--txt);
  border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px;resize:vertical;
  font-family:inherit;line-height:1.6;}
textarea::placeholder{color:#6b7f9c;}
#preview{display:none;margin-top:12px;border-radius:12px;overflow:hidden;border:1px solid var(--line);}
#preview img{width:100%;display:block;}
.status{font-size:13px;color:var(--sub);margin-top:10px;min-height:20px;line-height:1.5;}
.status.done{color:var(--accent2);}
.status.err{color:var(--danger);}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
.tag{background:rgba(94,200,255,.12);border:1px solid rgba(94,200,255,.3);color:var(--accent);
  border-radius:20px;padding:4px 12px;font-size:12.5px;display:flex;align-items:center;gap:6px;}
.tag button{background:none;border:none;color:var(--danger);font-size:15px;cursor:pointer;padding:0 2px;}
.chip{background:rgba(125,255,212,.1);border:1px solid rgba(125,255,212,.35);color:var(--accent2);
  border-radius:20px;padding:5px 12px;font-size:12.5px;margin:0 8px 6px 0;display:inline-block;}
.canvas-shell{position:relative;border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);}
canvas{width:100%;display:block;background:
  radial-gradient(600px 300px at 30% 20%, rgba(94,200,255,.18), transparent 60%),
  radial-gradient(500px 320px at 80% 90%, rgba(125,255,212,.12), transparent 55%),
  #0b1524;}
.canvas-empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;color:#5b6f8c;font-size:14px;gap:8px;text-align:center;padding:20px;pointer-events:none;}
.meta{font-size:12px;color:var(--sub);margin-top:8px;display:flex;justify-content:space-between;align-items:center;}
.meta button{background:none;border:1px solid var(--line);color:var(--sub);border-radius:8px;padding:4px 10px;font-size:12px;cursor:pointer;}
.hint{font-size:12px;color:var(--sub);line-height:1.7;margin:6px 0 0;}
.legend{font-size:11px;color:#7c8faa;margin-top:6px;}
input[type=file]{display:none;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>食材流体云</h1>
    <p class="pwa">单机版 · 数据存本机</p>
  </header>

  <!-- 输入区 -->
  <div class="card">
    <h2>① 获取食材信息</h2>
    <div class="row">
      <label class="btn">
        <span class="ico">📷</span><span>拍照识别</span>
        <input type="file" accept="image/*" capture="environment" id="camera-input">
      </label>
      <label class="btn">
        <span class="ico">🖼️</span><span>从相册选图</span>
        <input type="file" accept="image/*" id="gallery-input">
      </label>
    </div>
    <div id="preview"></div>
    <div class="status" id="status">支持拍照 / 相册选图（含食谱、采购单、手写清单截图），自动识别并提取食材。</div>
  </div>

  <!-- 手动输入 -->
  <div class="card">
    <h2>② 食材清单（可手动调整）</h2>
    <textarea id="ingredients" placeholder="例如：鸡蛋 3 个、西红柿 2 个、五花肉 300g、葱 1 根、大蒜、生抽、盐"></textarea>
    <div class="row" style="margin-top:10px;flex-wrap:nowrap;">
      <button class="btn primary" id="generate">生成流体云</button>
      <button class="btn" id="clearAll">清空</button>
    </div>
    <div class="tags" id="tags"></div>
  </div>

  <!-- 流体云画布 -->
  <div class="card">
    <h2>③ 食材准备页</h2>
    <div class="canvas-shell">
      <canvas id="cloud"></canvas>
      <div class="canvas-empty" id="emptyHint">🧺<br>还没有内容<br>点击上方「生成流体云」</div>
    </div>
    <div class="meta">
      <span id="meta">共 0 种食材</span>
      <button id="download">保存图片</button>
    </div>
    <div class="legend">提示：按数量/克重的食材显示更大；长按画布可暂停动画。</div>
  </div>

  <!-- 历史记录 -->
  <div class="card" id="historyCard">
    <h2>④ 历史记录</h2>
    <div id="history"></div>
    <p class="hint">每次生成会自动存入本机，下次打开仍在。识别文字仅供辅助，请以实际食材为准。</p>
  </div>
</div>

<!-- OCR 库（本地优先，失败自动切备用源） -->
<script src="lib/tesseract.min.js"></script>
<script>
(function(){
  if(!window.Tesseract){
    var s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
    s.onload=function(){console.log('OCR loaded(remote)');};
    document.head.appendChild(s);
  }
})();
</script>
<script src="app.js"></script>
<script>
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
</script>
</body>
</html>

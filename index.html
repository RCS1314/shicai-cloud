<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FFF8E7">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>食材流体云 · 首页</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <div class="ht">
      <h1>食材流体云</h1>
      <p class="sub">灵动岛 · 单机版 · 三步走</p>
    </div>
  </header>

  <!-- Hero -->
  <div class="hero">
    <span class="logo">🧺</span>
    <h2>准备了什么，一眼看清</h2>
    <p>拍照识别食材 → 核对生成清单 → 灵动岛边备菜边打勾，做完一行消失一行。</p>
  </div>

  <!-- 继续未完成 -->
  <a href="show.html" class="card home-card" id="continueCard" style="text-decoration:none;display:none;">
    <div class="hc-ico">▶️</div>
    <div>
      <h3>继续准备</h3>
      <p id="contInfo"></p>
    </div>
    <span class="hc-go">›</span>
  </a>

  <!-- 三个步骤 -->
  <div class="steps" style="padding:8px 0 14px;">
    <div class="step active"><span class="dot">1</span>识别</div>
    <div class="step-line"></div>
    <div class="step"><span class="dot">2</span>生成</div>
    <div class="step-line"></div>
    <div class="step"><span class="dot">3</span>展示</div>
  </div>

  <a href="scan.html" class="card home-card" style="text-decoration:none;">
    <div class="hc-ico" style="background:rgba(174,217,240,.55);border-color:rgba(130,180,225,.8);">📷</div>
    <div>
      <h3>识别页面</h3>
      <p>拍照 / 相册选图，离线 OCR 自动提取食材</p>
    </div>
    <span class="hc-go">›</span>
  </a>

  <a href="edit.html" class="card home-card" style="text-decoration:none;">
    <div class="hc-ico" style="background:rgba(174,232,208,.55);border-color:rgba(120,210,178,.8);">✏️</div>
    <div>
      <h3>生成页面</h3>
      <p>核对清单、改数量、增删食材，一键生成</p>
    </div>
    <span class="hc-go">›</span>
  </a>

  <a href="show.html" class="card home-card" style="text-decoration:none;">
    <div class="hc-ico" style="background:rgba(255,203,219,.55);border-color:rgba(250,168,186,.8);">🌀</div>
    <div>
      <h3>展示页面</h3>
      <p>灵动岛食材清单，打勾一行泡沫消失</p>
    </div>
    <span class="hc-go">›</span>
  </a>

  <!-- 历史 -->
  <div class="card home-note">
    <h4>历史上次清单</h4>
    <div id="homeHistory"></div>
  </div>
</div>

<!-- 底部导航 -->
<nav class="tabbar"><div class="tb-in">
  <a data-tab="home" href="index.html"><span class="ti">🏠</span>首页</a>
  <a data-tab="scan" href="scan.html"><span class="ti">📷</span>识别</a>
  <a data-tab="edit" href="edit.html"><span class="ti">✏️</span>生成</a>
  <a data-tab="show" href="show.html"><span class="ti">🌀</span>展示</a>
</div></nav>

<script src="app.js"></script>
<script>FC.initHome();</script>
<script>
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
</script>
</body>
</html>
